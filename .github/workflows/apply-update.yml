name: Apply update
on:
  push:
    paths:
      - 'update.zip'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unpack update.zip into the repo and commit
        run: |
          unzip -o update.zip -d .
          git rm -q update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898349+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update.zip"
          git push
