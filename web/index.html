<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chakka Saarthi – fleet and trip management for transport businesses (admin website).">
  <meta name="theme-color" content="#14161F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chakka Saarthi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Chakka Saarthi</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161F; }
    #cs-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 18px; color: #F4F4F0; font-family: system-ui, sans-serif; }
    #cs-loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="cs-loading"><img src="icons/Icon-192.png" alt=""><div>Loading Chakka Saarthi…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cs-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
